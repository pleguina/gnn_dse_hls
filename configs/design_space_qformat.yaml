# =============================================================================
# FIXED-POINT Q FORMAT EXPLORATION
# =============================================================================
#
# This config explores fixed-point Q(W,I) formats for ap_fixed implementation
#
# Usage:
#   python src/explore_design_space.py --config configs/design_space_qformat.yaml
#
# =============================================================================

exploration:
  strategy: "grid"
  output_dir: "build/experiments_qformat"
  resume: true
  max_designs: 0
  parallel_hls_jobs: 1
  skip_hls: false

# -----------------------------------------------------------------------------
# SEARCH SPACE - Fixed architecture, sweep Q formats
# -----------------------------------------------------------------------------
search_space:
  algorithm:
    in_channels_reduced: [ 16 ] # Fixed architecture
    hidden_channels: [ 24 ]
    root_weight: [ false ]
    dropout: [ 0.5 ]
    num_layers: [ 2 ]

  quantization:
    # Not used for fixed-point, but required
    M_BITS: [ 24 ]
    K_BITS: [ 12 ]
    bitwidth_margin: [ 2 ]
    method: [ "symmetric" ]

  hls:
    # Only explore fixed-point implementation
    implementations: [ "fixed" ]

    # Fixed-point Q format exploration
    fixed:
      # Data/activation Q format: Q(W, I)
      # More I → larger range, less F → less precision
      data_w: [ 16, 24, 32 ] # Total bits: 16, 24, 32
      data_i: [ 8, 12, 16 ] # Integer bits: 8, 12, 16

      # Weight Q format
      weight_w: [ 16, 24 ] # Total bits: 16, 24
      weight_i: [ 4, 8 ] # Integer bits: 4, 8

      # Accumulator Q format (higher precision)
      acc_w: [ 32, 48 ] # Total bits: 32, 48
      acc_i: [ 16, 24 ] # Integer bits: 16, 24

    # HLS pragmas (simple config)
    unroll:
      nodes: [ 0 ] # Fully unroll
      features_agg: [ 0 ] # Fully unroll
      features_lin: [ 0 ] # Fully unroll
      features_relu: [ 0 ] # Fully unroll

    pipeline:
      agg_ii: [ 1 ]
      lin_ii: [ 1 ]

    bind:
      agg_mul: [ "dsp" ]
      lin_scale_mul: [ "dsp" ]

    allocation:
      agg_mul_limit: [ "unlimited" ]
      lin_mul_limit: [ "unlimited" ]

    target_clock_ns: 2.77 # 361 MHz

# -----------------------------------------------------------------------------
# FILTERING
# -----------------------------------------------------------------------------
constraints:
  min_fmax_mhz: 200
  max_dsp_pct: 100

# -----------------------------------------------------------------------------
# PARETO ANALYSIS
# -----------------------------------------------------------------------------
pareto:
  objectives:
    accuracy:
      direction: "max"
      weight: 1.0
    dsp_used:
      direction: "min"
      weight: 1.0
    latency_cycles:
      direction: "min"
      weight: 0.5

  plots_2d:
  - [ accuracy, dsp_used ]
  - [ accuracy, latency_cycles ]
  - [ dsp_used, latency_cycles ]

  plots_3d:
  - [ accuracy, latency_cycles, dsp_used ]

# -----------------------------------------------------------------------------
# NOTES
# -----------------------------------------------------------------------------
# Expected design points:
#   Data configs: 3 (data_w) × 3 (data_i) = 9 (filter invalid: I >= W)
#   Weight configs: 2 (weight_w) × 2 (weight_i) = 4
#   Acc configs: 2 (acc_w) × 2 (acc_i) = 4
#   Total: ~9 × 4 × 4 = 144 designs (after filtering invalid Q formats)
#
# Trade-offs to explore:
#   1. Precision vs Size: Q(16,8) vs Q(24,12) vs Q(32,16)
#   2. Range vs Precision: Q(24,8) more precision vs Q(24,16) larger range
#   3. Weights vs Data: Can weights use lower precision? Q(16,4) vs Q(24,8)
#   4. Accumulator precision: Does Q(48,24) improve accuracy vs Q(32,16)?
#
# Expected results:
#   - Higher data_w → better accuracy (more fractional bits)
#   - Higher data_i → handles larger values (avoids overflow/clipping)
#   - Sweet spot likely Q(24,12) or Q(24,8): good precision, moderate size
#   - Weights can likely use lower precision: Q(16,4) sufficient
