# =============================================================================
# DESIGN SPACE CONFIGURATION FOR PTQ INT8 OPTIMIZATION
# =============================================================================
#
# This file defines the exploration space for the full pipeline:
#   Python Model → PTQ INT8 → HLS Implementation → Pareto Analysis
#
# Usage:
#   python src/explore_design_space.py --config configs/design_space.yaml
#
# =============================================================================

# -----------------------------------------------------------------------------
# EXPLORATION SETTINGS
# -----------------------------------------------------------------------------
exploration:
  # Exploration strategy: "grid" (all combinations) or "staged" (filtered)
  strategy: "staged"

  # Output directory for all experiment results
  output_dir: "build/experiments"

  # Resume from previous run if checkpoint exists
  resume: true

  # Maximum number of design points to evaluate (0 = unlimited)
  max_designs: 0

  # Parallel HLS synthesis jobs (1 = sequential)
  parallel_hls_jobs: 1

  # Skip HLS synthesis (for quick Python/PTQ-only exploration)
  skip_hls: false

  # Use HLS estimation only (faster, less accurate resource estimates)
  hls_estimation_only: false

# -----------------------------------------------------------------------------
# STAGE 1: ALGORITHM / MODEL LEVEL
# -----------------------------------------------------------------------------
# These affect accuracy, parameter count, memory footprint
# Filter: Only keep models with accuracy >= accuracy_threshold

algorithm:
  # Input feature projection dimension (after Linear(1433 → X))
  in_channels_reduced: [ 16, 24 ]

  # Hidden layer dimension (SAGEConv output)
  hidden_channels: [ 24, 32, 48 ]

  # Dropout rate
  dropout: [ 0.5 ]

  # Root weight in SAGEConv (False = HLS-compatible simplified formula)
  root_weight: [ false ]

  # Number of GNN layers (currently only 2 supported)
  num_layers: [ 2 ]

  # Minimum accuracy threshold to proceed to Stage 2 (%)
  accuracy_threshold: 70.0

  # Pre-trained model directory (if using pre-trained models)
  # Set to null to train from scratch
  pretrained_dir: "build/models"

  # Training epochs (if training from scratch)
  train_epochs: 200

# -----------------------------------------------------------------------------
# STAGE 2: QUANTIZATION / FIXED-POINT LEVEL
# -----------------------------------------------------------------------------
# These affect numerical precision vs hardware efficiency
# Filter: Only keep configs with LSB error <= max_lsb_error

quantization:
  # Fractional bits for fixed-point scale factors
  # M=24: exact match with PTQ-Float, larger multipliers
  # M=20: ~13 LSB max error, smaller multipliers
  M_BITS: [ 24 ]

  # Adjacency matrix scaling: A_int = round(A_float * 2^K_BITS)
  K_BITS: [ 12 ]

  # Safety margin bits added to computed bit-widths
  bitwidth_margin: [ 2, 4 ]

  # Bit-width computation method
  # "theoretical": worst-case bounds from model dimensions
  # "data_driven": actual maxima from integer simulation
  method: [ "data_driven" ]

  # Maximum allowed LSB error vs PTQ-Float reference
  max_lsb_error: 1

# -----------------------------------------------------------------------------
# STAGE 3: HLS IMPLEMENTATION LEVEL
# -----------------------------------------------------------------------------
# These affect latency, DSPs, LUTs, Fmax
# Filter: Pareto pruning on (Latency, DSP, LUT)

hls:
  # HLS implementations to evaluate
  # float: FP32 (skip - 283% DSP usage, doesn't fit)
  # int8: INT8 with fixed-point scales (skip - int8_po2 is better)
  # int8_po2: INT8 with power-of-2 scales (✅ best for hardware)
  # fixed: ap_fixed configurable bitwidths (✅ good for exploring precision)
  # ptq: PTQ implementation (skip - broken)
  implementations: [ "int8_po2", "fixed" ]

  # Target FPGA device
  target_device: "xcvu13p-fsga2577-1-e"

  # Target clock period (ns)
  target_clock_ns: 2.77

  # Loop unrolling factors
  unroll:
    # Node dimension unroll (NUM_NODES = 8)
    nodes: [ 1, 8 ]

    # Aggregation feature loop unroll
    features_agg: [ 1, 4 ]

    # Linear feature loop unroll  
    features_lin: [ 1, 4 ]

    # ReLU feature loop unroll
    features_relu: [ 1 ]

  # Pipeline initiation interval
  pipeline:
    # Aggregation pipeline II
    agg_ii: [ 1 ]

    # Linear pipeline II
    lin_ii: [ 1 ]

  # Resource binding for multipliers
  bind:
    # Aggregation multiplier: "auto", "dsp", "fabric"
    agg_mul: [ "auto" ]

    # Linear scaling multiplier: "auto", "dsp", "fabric"
    lin_scale_mul: [ "auto" ]

  # Resource allocation limits (DSP reuse control)
  # Limits number of multiplier instances → forces time-multiplexing
  # Lower limit = more reuse = fewer DSPs but higher latency & II
  #
  # IMPORTANT: Limits are automatically filtered to be divisors of demand
  # - Demand = unroll_nodes × unroll_features
  # - Valid limits: divisors of demand (1, 2, 4, 8, 16, 32 for demand=32)
  # - Invalid: limits > demand or non-divisors (cause fractional reuse)
  allocation:
    # Aggregation multiplier limits
    # "unlimited" = no limit (full parallelism)
    # Reduced set covering meaningful reuse factors:
    #   - unlimited: baseline (no reuse)
    #   - 16: 2× reuse when demand=32
    #   - 4:  4-8× reuse depending on demand
    #   - 1:  maximum reuse (likely too slow, but included for completeness)
    agg_mul_limit: [ "unlimited", 16, 4, 1 ]

    # Linear multiplier limits (same philosophy)
    lin_mul_limit: [ "unlimited", 16, 4, 1 ]
    # This gives 4×4=16 allocation combinations instead of 49
    # Reduces design points from ~4,320 to ~1,400 (67% reduction)

    # Array partitioning (future extension)
    # partition:
    #   weights: ["complete"]
    #   activations: ["complete"]

    # Implementation-specific configurations
  int8_po2:
    # Fractional bits for power-of-2 approximated scales
    M_BITS_VALUES: [ 20, 24 ] # 20=smaller multipliers, 24=better accuracy

  fixed:
    # ap_fixed bitwidths (Q format)
    data_w: [ 24, 32 ] # Total bits for data (activations)
    data_i: [ 12, 16 ] # Integer bits for data  
    weight_w: [ 24 ] # Total bits for weights
    weight_i: [ 8 ] # Integer bits for weights
    acc_w: [ 48 ] # Total bits for accumulators
    acc_i: [ 24 ] # Integer bits for accumulators

  # Minimum acceptable Fmax (MHz) - reject designs below this
  min_fmax_mhz: 200

  # Maximum acceptable DSP utilization (%) - reject designs above this
  max_dsp_pct: 100

# -----------------------------------------------------------------------------
# PARETO ANALYSIS SETTINGS
# -----------------------------------------------------------------------------
pareto:
  # Objectives to optimize (direction: "min" or "max")
  objectives:
    accuracy:
      direction: "max"
      weight: 1.0

    latency_cycles:
      direction: "min"
      weight: 1.0

    dsp_used:
      direction: "min"
      weight: 1.0

    lut_used:
      direction: "min"
      weight: 0.5

  # 2D Pareto plots to generate
  plots_2d:
  - [ accuracy, dsp_used ]
  - [ accuracy, latency_cycles ]
  - [ latency_cycles, dsp_used ]
  - [ accuracy, lut_used ]
  # 3D Pareto plots (optional)
  plots_3d:
  - [ accuracy, latency_cycles, dsp_used ]

# -----------------------------------------------------------------------------
# BASELINE CONFIGURATION (for comparison)
# -----------------------------------------------------------------------------
baseline:
  # Reference design to compare against
  name: "baseline_int8"
  in_channels_reduced: 16
  hidden_channels: 24
  M_BITS: 24
  K_BITS: 12
  bitwidth_margin: 2
  unroll_nodes: 1
  unroll_features_agg: 1
  unroll_features_lin: 1
