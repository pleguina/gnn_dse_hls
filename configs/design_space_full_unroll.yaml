# =============================================================================
# SINGLE DESIGN POINT: FULL UNROLL WITH II=1
# =============================================================================
#
# This configuration runs a single design point with:
# - Complete loop unrolling (unroll = 0 means complete unroll)
# - Top-level pipeline II=1 (forces maximum parallelism)
# - All arrays fully partitioned
# - Unlimited resource allocation
#
# This creates the fastest possible design but uses maximum resources.
#
# Usage:
#   ./run_exploration_with_viz.sh configs/design_space_full_unroll.yaml
#   python src/explore_design_space.py --config configs/design_space_full_unroll.yaml
#
# =============================================================================

# -----------------------------------------------------------------------------
# EXPLORATION SETTINGS
# -----------------------------------------------------------------------------
exploration:
  strategy: "grid"  # Simple grid (only 1 point anyway)
  output_dir: "build/experiments"
  resume: false
  max_designs: 0
  parallel_hls_jobs: 1
  skip_hls: false
  hls_estimation_only: false

# -----------------------------------------------------------------------------
# ALGORITHM LEVEL - Single fixed configuration
# -----------------------------------------------------------------------------
algorithm:
  in_channels_reduced: [ 16 ]
  hidden_channels: [ 24 ]
  dropout: [ 0.5 ]
  root_weight: [ false ]
  num_layers: [ 2 ]
  accuracy_threshold: 0.0  # No threshold
  pretrained_dir: "build/models"
  train_epochs: 200

# -----------------------------------------------------------------------------
# QUANTIZATION LEVEL - Single fixed configuration
# -----------------------------------------------------------------------------
quantization:
  M_BITS: [ 24 ]
  K_BITS: [ 12 ]
  bitwidth_margin: [ 2 ]
  method: [ "data_driven" ]
  max_lsb_error: 9999  # No threshold

# -----------------------------------------------------------------------------
# HLS LEVEL - FULL UNROLL + II=1 (Maximum Parallelism)
# -----------------------------------------------------------------------------
hls:
  implementations: [ "int8_po2" ]
  target_device: "xcvu13p-fsga2577-1-e"
  target_clock_ns: 2.77

  # Loop unrolling factors
  # NOTE: 0 = COMPLETE UNROLL (all iterations in parallel)
  #       For 8 nodes, unroll_nodes: [0] or [8] both fully unroll
  unroll:
    nodes: [ 0 ]            # Complete unroll (all 8 nodes in parallel)
    features_agg: [ 0 ]     # Complete unroll (all features in parallel)
    features_lin: [ 0 ]     # Complete unroll (all features in parallel)
    features_relu: [ 0 ]    # Complete unroll (all features in parallel)

  # Pipeline initiation interval = 1
  # Combined with complete unrolling, this creates II=1 for the entire layer
  pipeline:
    agg_ii: [ 1 ]
    lin_ii: [ 1 ]

  # Resource binding - let tools decide
  bind:
    agg_mul: [ "auto" ]
    lin_scale_mul: [ "auto" ]

  # Resource allocation - UNLIMITED (no reuse, maximum parallelism)
  allocation:
    agg_mul_limit: [ "unlimited" ]
    lin_mul_limit: [ "unlimited" ]

  # Implementation-specific settings
  int8_po2:
    M_BITS_VALUES: [ 24 ]

  # Resource constraints - relaxed for this high-performance design
  min_fmax_mhz: 100  # Lower minimum since design will be large
  max_dsp_pct: 100   # May exceed 100% - shows resource requirements

# -----------------------------------------------------------------------------
# PARETO ANALYSIS - Single point (no analysis needed)
# -----------------------------------------------------------------------------
pareto:
  objectives:
    accuracy:
      direction: "max"
      weight: 1.0
    latency_cycles:
      direction: "min"
      weight: 1.0
    dsp_used:
      direction: "min"
      weight: 1.0
    lut_used:
      direction: "min"
      weight: 0.5

  plots_2d:
  - [ accuracy, dsp_used ]
  - [ accuracy, latency_cycles ]

  plots_3d: []

# -----------------------------------------------------------------------------
# BASELINE
# -----------------------------------------------------------------------------
baseline:
  name: "full_unroll_ii1"
  in_channels_reduced: 16
  hidden_channels: 24
  M_BITS: 24
  K_BITS: 12
  bitwidth_margin: 2
  unroll_nodes: 0
  unroll_features_agg: 0
  unroll_features_lin: 0
