# Design Space for Presentation - Pareto-Optimal Exploration (OPTIMIZED)
# Goal: Generate nice Accuracy vs DSP/Latency trade-off curves
# Estimated runtime: ~16 design points × 6-8 min = 1.5-2 hours

algorithm:
  in_channels: [ 16 ] # Fixed (Cora reduced)
  hidden_channels: [ 16, 24 ] # 2 model sizes (32 was dominated, removed)
  out_channels: [ 7 ] # Fixed (Cora classes)
  num_layers: [ 2 ] # Fixed

  aggregation: [ "mean" ]
  use_root_features: [ false ] # Keep simple - adding root doubles points

quantization:
  weight_bit_width: [ 8 ]
  act_bit_width: [ 8 ]
  scale_type: [ "po2" ]

  # Quantization parameters (PTQ configuration)
  M_BITS: [ 24 ] # Fixed - fractional bits for data/weights
  K_BITS: [ 12 ] # Fixed - adjacency scaling
  bitwidth_margin: [ 2 ]
  method: [ "symmetric" ]

hls:
  implementations: [ "int8_po2" ] # This is what actually gets used!

  # Unroll strategies: from sequential to parallel
  # Creates clear latency vs DSP trade-off
  unroll:
    nodes: [ 1, 8, 0 ] # 1=sequential, 8=medium parallel, 0=complete
    features_agg: [ 1, 8, 0 ] # 1=sequential, 8=medium, 0=complete (16 or 24)
    features_lin: [ 1, 8, 0 ] # 1=sequential, 8=medium, 0=complete (16 or 24)
    features_relu: [ 1 ] # Fixed
    outputs: [ 1, 0 ] # 1=pipeline (low resources), 0=unroll (7 parallel, high resources)

  # Pipeline settings
  pipeline:
    agg_ii: [ 1 ] # II=1 (fully pipelined)
    lin_ii: [ 1 ]

  # Resource binding - DSP vs LUT trade-off
  bind:
    agg_mul: [ "dsp" ] # Keep aggregation on DSP (INT16×INT8 too expensive on fabric)
    lin_scale_mul: [ "fabric" ] # Use fabric for INT8×INT8 (cheaper than DSP)

  # Allocation limits - skip these, they add complexity without clear benefit
  allocation:
    agg_mul_limit: [ "unlimited" ]
    lin_mul_limit: [ "unlimited" ]

  target_clock_ns: 2.77 # 361 MHz

# Expected design points:
#   2 hidden × (3 unroll_nodes × 3 unroll_agg × 3 unroll_lin × 2 unroll_outputs) = 2 × 54 = 108 points
#
# OPTIMIZED: Carefully selected unroll factors
#   - Dropped hidden_channels=32 (was Pareto-dominated by 24)
#   - Using [1, 8, 0]: sequential, medium (divides both 16&24), complete
#   - Added outputs=[1, 0]: pipeline vs unroll (7 outputs - adds 2x designs)
#   - Dropped lin_scale_mul="dsp" (fabric is better for INT8×INT8)
#
# Pareto axes:
#   - X: DSP count (varies with unroll and hidden_channels)
#   - Y: Accuracy (varies with hidden_channels)
#   - Color: Latency (varies with unroll)
